<!-- DriverX floating chat widget: paste before </body> on any page -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
#dx *{box-sizing:border-box;font-family:'Poppins',system-ui,sans-serif}
:where(#dx *){margin:0}
:where(#dx button){background:none;border:0;padding:0;color:inherit;font-size:inherit}
#dx{--g:#1b5e2a;--g2:#2e9e4f;--lg:#7fd88f;--bg:#f1f6f1;--tx:#1a1a1a;position:fixed;right:20px;bottom:20px;z-index:99999;color:var(--tx)}
#dx button{font-family:inherit;cursor:pointer}
#dxL{display:flex;align-items:center;gap:12px;background:var(--g);color:#fff;border:0;border-radius:40px;padding:12px 22px 12px 14px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#dxL i{width:30px;height:30px;border-radius:50%;background:var(--lg);color:var(--g);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px}
#dxP{display:none;width:392px;max-width:calc(100vw - 24px);height:min(630px,calc(100vh - 40px));background:var(--bg);border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.28);flex-direction:column}
#dx.open #dxP{display:flex}#dx.open #dxL{display:none}
.dxH{background:var(--g);color:#fff;padding:16px 18px 14px;flex:none}
.dxT{display:flex;align-items:center;justify-content:space-between}
.dxLogo{font-weight:700;font-size:17px}.dxLogo b{color:var(--lg)}.dxLogo span{font-weight:500;color:#cfe8d3;font-size:15px;margin-left:5px}
.dxIc{display:flex;gap:18px;align-items:center}.dxT button{display:flex;align-items:center;color:#fff}.dxT svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dxH h2{font-size:21px;line-height:1.25;font-weight:600;margin:20px 0 6px}
.dxH p{font-size:13.5px;color:#d6ecd9;margin-bottom:16px}
.dxS{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;gap:6px;justify-content:space-between;font-size:12px;font-weight:500;color:#b9d6be;white-space:nowrap;overflow:hidden}
.dxS .st{display:flex;align-items:center;gap:5px;flex:none}.dxS .st em{width:20px;height:20px;border-radius:50%;border:1.5px solid #8fbf98;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;flex:none}
.dxS .st.on{color:#fff;font-weight:600}.dxS .st.on em{border-color:#fff}.dxS .st.done{color:#fff}.dxS .st.done em{background:var(--lg);border-color:var(--lg);color:var(--g);font-size:11px}
.dxS hr{flex:1;border:0;border-top:1.5px solid #8fbf98;min-width:4px;max-width:14px}
.dxS.sm{margin-top:14px;padding:10px 12px}
.dxB{flex:1;overflow-y:auto;padding:14px 12px}
.dxB::-webkit-scrollbar{width:5px}.dxB::-webkit-scrollbar-thumb{background:#c5d3c6;border-radius:5px}
.dxQ{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dxQ button{background:#fff;border:1px solid #dfe8e0;border-radius:14px;padding:14px;text-align:left;font-size:14px;font-weight:600;color:var(--tx);line-height:1.35;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.dxQ button:hover{border-color:var(--g2)}
.dxQ i{width:26px;height:26px;border-radius:7px;background:#e3f3e6;color:var(--g);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11.5px}
.dxA{background:#fff;border:1px solid #dfe8e0;border-radius:14px;padding:14px;margin-top:10px}
.dxA .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.dxA .r small{font-size:11.5px;color:#7a8a7c;font-weight:400;text-align:right;line-height:1.4}
.dxA .f{display:flex;gap:8px;margin-top:10px}
.dxA input{flex:1;min-width:0;border:1px solid #cfd9d0;border-radius:10px;padding:11px 12px;font-size:13px;outline:none}
.dxA .f button{background:#111;color:#fff;border:0;border-radius:10px;padding:0 20px;font-weight:600;font-size:14px}
.dxM{display:flex;margin-bottom:12px}.dxM.u{justify-content:flex-end}
.dxM>div{max-width:88%;font-size:14.5px;line-height:1.5;padding:12px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.dxM.u>div{background:var(--g2);color:#fff;font-weight:500;padding:9px 16px;border-radius:18px}
.dxM.b>div{background:#fff;border:1px solid #dfe8e0}
.dxM.b.ok>div{padding:10px 14px}
.dxN{border-radius:8px;padding:10px 12px;margin:10px 0 0;font-size:14px;background:#eef0ee}
.dxN.h{background:#e8f4ea}.dxN small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:#5c6b5e;margin-bottom:4px}.dxN.h small{color:var(--g)}
.dxC{background:#fff;border:1.5px solid var(--g2);border-radius:14px;padding:14px;margin:0 0 12px;max-width:88%}
.dxC small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--g);margin-bottom:6px}
.dxC h4{font-size:15.5px;font-weight:600;line-height:1.3}
.dxC .p{margin:8px 0;font-size:26px;font-weight:700}.dxC .p s{font-size:14px;color:#9aa;font-weight:400;margin:0 6px}.dxC .p span{font-size:12px;background:#e3f3e6;color:var(--g);border-radius:8px;padding:3px 9px;font-weight:600;vertical-align:middle}
.dxC li{list-style:none;font-size:12.5px;color:#334;margin:5px 0;padding-left:16px;position:relative;line-height:1.4}.dxC li:before{content:"✓";position:absolute;left:0;color:var(--g2)}
.dxBt{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dxBt a{border-radius:24px;padding:11px 18px;font-weight:600;font-size:14px;text-decoration:none;border:1.5px solid #111;color:#111;background:#fff}
.dxBt a.p{background:var(--g2);border-color:var(--g2);color:#fff}
.dxCh{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:0 0 12px}
.dxCh.row{flex-direction:row;flex-wrap:wrap}
.dxCh button{background:#fff;border:1.5px solid var(--g2);color:var(--g);border-radius:20px;padding:9px 14px;font-size:13.5px;font-weight:500}
.dxCh button.g{border-color:#cfd9d0;color:#667}
.dxCh button:hover{background:#e8f4ea}
.dxTy{display:flex;gap:4px;padding:14px 16px!important}.dxTy i{width:7px;height:7px;border-radius:50%;background:#9bb;animation:dxb 1s infinite}.dxTy i:nth-child(2){animation-delay:.15s}.dxTy i:nth-child(3){animation-delay:.3s}
@keyframes dxb{0%,60%,100%{opacity:.3}30%{opacity:1}}
.dxF{flex:none;background:var(--bg);padding:10px 12px 12px;border-top:1px solid #e1eae2}
.dxI{display:flex;align-items:center;background:#fff;border:1.5px solid var(--g2);border-radius:28px;padding:6px 6px 6px 18px}
.dxI input{flex:1;border:0;outline:0;font-size:14px;min-width:0;background:none}
.dxI button{width:36px;height:36px;border-radius:50%;border:0;background:var(--g2);color:#fff;font-size:18px;display:grid;place-items:center}
.dxF p{text-align:center;font-size:10.5px;color:#7a8a7c;margin-top:8px;white-space:nowrap}
 @media(max-width:430px){#dx{right:0;bottom:0;left:0}#dxL{position:fixed;right:14px;bottom:14px}#dxP{width:100vw;max-width:100vw;height:100dvh;border-radius:0}.dxS{font-size:11px;padding:9px 10px;gap:4px}.dxS .st{gap:4px}.dxS .st em{width:18px;height:18px}.dxS hr{min-width:3px;max-width:10px}.dxH h2{font-size:19px}}
@media(max-width:350px){.dxS .st:not(.on) .l{display:none}}
.dxHome #dxChat,.dxChatV #dxHome{display:none}
</style>
<div id="dx" class="dxHome">
  <button id="dxL"><i>X</i>Ask DriverX</button>
  <div id="dxP">
    <div class="dxH">
      <div class="dxT">
        <div style="display:flex;align-items:center;gap:12px"><button id="dxBk" style="display:none"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><div class="dxLogo">DRIVER<b>X</b><span>Assistant</span></div></div>
        <div class="dxIc"><button id="dxMin"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button id="dxX"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      </div>
      <div id="dxHT"><h2>Hi — where are you on your driving journey?</h2><p>I’ll match you to the right DriverX lessons, package, or road-test prep.</p></div>
      <div class="dxS" id="dxSt"></div>
    </div>
    <div class="dxB" id="dxBody">
      <div id="dxHome">
        <div class="dxQ">
          <button data-q="I have my G1 — what’s next?" data-s="1"><i>G1</i>I have my G1 — what’s next?</button>
          <button data-q="Prepare for my G2 or G road test" data-s="1"><i>G2</i>Prepare for my G2 or G road test</button>
          <button data-q="Which package is right for me?"><i>▦</i>Which package is right for me?</button>
          <button data-q="I need a car for my road test"><i>🚗</i>I need a car for my road test</button>
        </div>
        <div class="dxA"><div class="r"><span>Are we in your area?</span><small>Toronto · Mississauga · Brampton · Hamilton +</small></div>
          <div class="f"><input id="dxPc" placeholder="Postal code, e.g. M5V 2T6"><button id="dxChk">Check</button></div></div>
      </div>
      <div id="dxChat"></div>
    </div>
    <div class="dxF"><div class="dxI"><input id="dxIn" placeholder="Ask anything about lessons, tests or pricing…"><button id="dxSd">↑</button></div>
      <p>AI assistant · For MTO rules, we’ll always point you to the official source</p></div>
  </div>
</div>
<script>
(function(){
const WEBHOOK="https://mateenb.app.n8n.cloud/webhook/fa4b425f-a95a-4464-a182-31f67a402329/chat";
const PHONE="+1 (289) 293-9760",TEL="+12892939760";
const $=s=>document.querySelector(s),root=$("#dx"),chat=$("#dxChat"),body=$("#dxBody"),inp=$("#dxIn");
let sid;try{sid=localStorage.dxSid}catch(e){}
if(!sid){sid="dx-"+Math.random().toString(36).slice(2)+Date.now();try{localStorage.dxSid=sid}catch(e){}}
let stage=0,started=false,busy=false;
const names=["Knowledge test","Road test","Full licence"],codes=["G1","G2","G"];
function steps(){$("#dxSt").innerHTML=names.map((n,i)=>`<span class="st ${i<stage?"done":i==stage?"on":""}"><em>${i<stage?"✓":codes[i]}</em><span class="l">${n}</span></span>`).join("<hr>")}
steps();
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function open(v){root.classList.toggle("open",v)}
$("#dxL").onclick=()=>open(true);$("#dxX").onclick=$("#dxMin").onclick=()=>open(false);
function mode(chatMode){started=chatMode;root.className=(chatMode?"dxChatV":"dxHome")+(root.classList.contains("open")?" open":"");
 $("#dxHT").style.display=chatMode?"none":"";$("#dxBk").style.display=chatMode?"":"none";$("#dxSt").classList.toggle("sm",chatMode);
 inp.placeholder=chatMode?"Ask a follow-up…":"Ask anything about lessons, tests or pricing…"}
$("#dxBk").onclick=()=>{chat.innerHTML="";mode(false)};
function scroll(){body.scrollTop=body.scrollHeight}
function user(t){const d=document.createElement("div");d.className="dxM u";d.innerHTML=`<div>${esc(t)}</div>`;chat.appendChild(d);scroll()}
function bot(html,cls){const d=document.createElement("div");d.className="dxM b "+(cls||"");d.innerHTML=`<div>${html}</div>`;chat.appendChild(d);scroll();return d}
function chips(list,row){if(!list||!list.length)return;const d=document.createElement("div");d.className="dxCh"+(row?" row":"");
 list.forEach(c=>{const b=document.createElement("button");b.textContent=c;if(/human/i.test(c))b.className="g";b.onclick=()=>{d.remove();send(c)};d.appendChild(b)});chat.appendChild(d);scroll()}
function card(c){const d=document.createElement("div");d.className="dxC";
 d.innerHTML=`<small>${esc(c.label||"RECOMMENDED FOR YOU")}</small><h4>${esc(c.title||"")}</h4>`+
 (c.price?`<div class="p">${esc(c.price)}${c.was?`<s>${esc(c.was)}</s>`:""}${c.badge?`<span>${esc(c.badge)}</span>`:""}</div>`:"")+
 `<ul>${(c.features||[]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`+
 `<div class="dxBt">${(c.buttons||[]).map((b,i)=>`<a href="${esc(b.url||"#")}" target="_blank" rel="noopener" class="${i?"":"p"}">${esc(b.label)}</a>`).join("")}</div>`;
 chat.appendChild(d);scroll()}
function parseBot(j){
 if(j&&typeof j==="object"&&!Array.isArray(j)&&(j.quick_replies||j.package||j.notice||j.info))return j;
 let w=Array.isArray(j)?j[0]:j,raw=(w&&typeof w==="object")?(w.output||w.text||w.reply||""):w;
 if(raw&&typeof raw==="object")return raw;
 raw=String(raw||"");
 try{return JSON.parse(raw.trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim())}catch(e){}
 const m=raw.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0])}catch(e){}}
 return{reply:raw}}
function render(j){
 const o=parseBot(j);let shown=false;
 if(o.notice){bot(`<b style="color:#1b5e2a">✔ ${esc(o.notice.title||"")}</b><br>${esc(o.notice.text||"")}`,"ok");shown=true}
 let h=fmt(o.reply||"");
 if(o.info){const t=o.info.title||"";h+=`<div class="dxN ${/driverx|how we help/i.test(t)?"h":""}">${t?`<small>${esc(t.toUpperCase())}</small>`:""}${(o.info.lines||[]).map(esc).join("<br>")}</div>`}
 if(h){bot(h);shown=true}
 const k=o.package;
 if(k){card({title:k.title,price:k.price,was:k.original_price,badge:k.badge,features:k.features,buttons:[k.book_url&&{label:"Book now",url:k.book_url},k.view_url&&{label:"View package",url:k.view_url}].filter(Boolean)});shown=true}
 if(!shown)bot("Sorry, I couldn’t process that. Please try again.");
 chips(o.quick_replies)}
function human(){
 bot("Of course. Our team answers Mon–Sat, 9 am – 8 pm — and I’ll pass along what you’ve told me so you don’t repeat yourself.");
 const d=document.createElement("div");d.className="dxC";d.style.border="1px solid #dfe8e0";
 d.innerHTML=`<h4>DriverX team</h4><ul style="margin-top:6px"><li>Mon–Sat, 9 am – 8 pm</li><li>Replies within a few minutes</li></ul><div class="dxBt"><a class="p" href="tel:${TEL}">Call ${PHONE}</a></div>`;
 chat.appendChild(d);chips(["Back to questions"]);
}
function pick(x){
 if(x==null)return"";
 if(typeof x==="string"){const t=x.trim().replace(/^```(?:json)?|```$/g,"").trim();
  if(t[0]==="{"||t[0]==="["){try{return pick(JSON.parse(t))}catch(e){}}
  if(t.indexOf('"type":"item"')>-1){let a="";t.split("\n").forEach(l=>{try{const j=JSON.parse(l);if(j.type==="item")a+=j.content||""}catch(e){}});if(a)return pick(a)}
  return x}
 if(Array.isArray(x)){for(let i=x.length-1;i>=0;i--){const v=pick(x[i]);if(v)return v}return""}
 if(typeof x!=="object")return String(x);
 if(x.card||x.chips||x.options||x.notes||x.service_area||x.stage!=null)return x;
 for(const k of["output","text","response","message","answer","reply","bot","content","data","json"]){if(x[k]){const v=pick(x[k]);if(v)return v}}
 return""}
async function send(t){
 t=(t||"").trim();if(!t||busy)return;inp.value="";if(!started)mode(true);user(t);
 if(/^talk to a human$/i.test(t)){human();return}
 if(/^back to questions$/i.test(t)){chat.innerHTML="";mode(false);return}
 busy=true;const ty=bot("<i></i><i></i><i></i>","");ty.firstChild.className="dxTy";
 try{
  const r=await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"sendMessage",sessionId:sid,chatInput:t})});
  const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){j=txt}
  ty.remove();console.log('DriverX raw response:',r.status,j);render(j);
 }catch(e){ty.remove();bot("Sorry, something went wrong. Please try again.");chips(["Talk to a human"])}
 busy=false;
}
document.querySelectorAll(".dxQ button").forEach(b=>b.onclick=()=>{if(b.dataset.s){stage=1;steps()}send(b.dataset.q)});
$("#dxChk").onclick=()=>{const v=$("#dxPc").value.trim();if(v)send("Are you in my area? My postal code is "+v)};
$("#dxPc").onkeydown=e=>{if(e.key==="Enter")$("#dxChk").click()};
$("#dxSd").onclick=()=>send(inp.value);inp.onkeydown=e=>{if(e.key==="Enter")send(inp.value)};
})();
</script>
